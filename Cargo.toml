[workspace]
resolver = "2"
members = [
    "crates/chimera",
    "crates/rnim_allocator",
    "crates/rnim_session",
    "crates/rnim_span",
    "crates/rnim_diag",
    "crates/rnim_lexer",
    "crates/rnim_parser",
    "crates/rnim_ast",
    "crates/rnim_symbols",
    "crates/rnim_hir",
    "crates/rnim_types",
    "crates/rnim_sema",
    "crates/rnim_effects",
    "crates/rnim_macro",
    "crates/rnim_vm",
    "crates/rnim_mir",
    "crates/rnim_lifetime",
    "crates/rnim_codegen_c",
    "crates/rnim_codegen_js",
    "crates/rnim_runtime",
    "crates/rnim_stdlib",
    "crates/rnim_nimble",
    "crates/rnim_docgen",
    "crates/rnim_suggest",
    "crates/rnim_test",
    "crates/rnim_fuzz",
    "crates/rnim_tools",
    "crates/rnim_build",
    "crates/rnim_query",
    "xtask",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "0BSD"

[workspace.dependencies]
camino = "1.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
codespan-reporting = "0.13"
rustc-hash = "2.0"
unicode-ident = "1.0"
smol_str = "0.2"
rowan = "0.15"
bumpalo = "3.0"
indexmap = "2.0"
slotmap = "1.0"
salsa = "0.18"
petgraph = "0.6"
smallvec = "1.0"
bitflags = "2.0"
ena = "0.14"
serde_json = "1.0"
ariadne = "0.4"
walkdir = "2.0"
similar = "2.0"
thiserror = "2.0"
parking_lot = "0.12"
once_cell = "1.0"
criterion = "0.5"
tempfile = "3.0"
pretty_assertions = "1.0"
proptest = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 1
